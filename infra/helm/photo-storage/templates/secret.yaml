apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: {{ .Values.backend.env.datasourceUrl | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.backend.env.datasourceUsername | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.backend.env.datasourcePassword | quote }}

  GOOGLE_CLIENT_ID: {{ .Values.backend.oauth.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.backend.oauth.google.clientSecret | quote }}

  NAVER_CLIENT_ID: {{ .Values.backend.oauth.naver.clientId | quote }}
  NAVER_CLIENT_SECRET: {{ .Values.backend.oauth.naver.clientSecret | quote }}

  KAKAO_CLIENT_ID: {{ .Values.backend.oauth.kakao.clientId | quote }}
